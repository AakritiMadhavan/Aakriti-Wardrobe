# Render Blueprint. Create it from the Render dashboard: New > Blueprint.
services:
  - type: web
    name: aakritis-wardrobe
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string when Render asks
      - key: ADMIN_PASSWORD
        sync: false          # choose the admin password when Render asks
      - key: SESSION_SECRET
        generateValue: true  # Render creates a random value
